<!DOCTYPE html>

<head>

<title>Reisekosten Tracker</title>
<meta name="theme-color" content="#12141b">

  <button class="tab-btn" data-view="trips" aria-label="Reisen">

  <button class="tab-btn" data-view="settings" aria-label="Einstellungen">
